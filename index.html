<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YeahBuddy Poker</title>
<meta name="description" content="Standings, results and history for the YeahBuddy Poker Thursday night league.">
<link rel="preload" as="image" href="logo.webp">
<meta name="theme-color" content="#5B8FC7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YeahBuddy">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script>

const API_URL = 'https://script.google.com/macros/s/AKfycbxXR-kItwWVRX9VWK9KpzJ0OsXpElC_HYgDyStIk6yq4P89JMmIqjABfdiE4UgQtGxTLw/exec';
</script>
<style>
:root{
  /* Colors from the YeahBuddy Poker logo: medium blue table, navy chip, gold, crimson, orange */
  --felt:#24497A; --felt-deep:#1E3F66; --felt-line:#6E9BCB; --felt-text:#E3ECF7;
  --navy:#14223A; --navy-2:#1B2B47; --orange:#E8893A;
  --ivory:#FBF6EA; --paper:#FFFCF5; --ink:#14223A; --mute:#5E6678; --rule:#E8DFCB; --sand:#F4ECDA;
  --chip:#A3282B; --chip-deep:#7A1C20; --brass:#C9A45C; --brass-deep:#8F6A2E;
  --good:#2C7A4B; --bad:#B42A24;
  --display:"Bricolage Grotesque","Arial Narrow",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
html{background:#2C5682}
body{min-height:100vh;background:linear-gradient(180deg,#5B8FC7 0%,#3F73AD 45%,#2C5682 100%) fixed #3F73AD}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:17px;font-weight:600}
p{margin:0}
.meta{color:var(--mute);font-size:14px}
.hint{font-size:14px;color:var(--mute);margin-top:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

main{max-width:760px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
.sheet{background:var(--paper);border-radius:18px;padding:18px 16px;margin-bottom:16px;box-shadow:0 1px 0 rgba(0,0,0,.25),0 10px 30px -18px rgba(0,0,0,.6)}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 14px;color:var(--ivory)}
.page-head h1{color:var(--ivory)}

/* account button */
.acct{flex:none;border:1.5px solid #E3ECF7;background:transparent;color:var(--ivory);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct.in{background:var(--navy);color:var(--ivory);border-color:var(--navy)}

/* ---------- home hero ---------- */
.hero{position:relative;display:grid;justify-items:center;margin:34px 0 14px}
.hero .logo{width:min(260px,66vw);height:auto;display:block;filter:drop-shadow(0 10px 18px rgba(14,26,46,.35))}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand{font:800 clamp(36px,10.5vw,58px)/.9 var(--display);color:var(--ivory);letter-spacing:-.03em}
.brand span{display:block;color:var(--brass)}
.tagline{color:var(--felt-text);font-size:14px;margin-top:6px}
.hero .acct{position:absolute;top:-30px;right:0}

.potline{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;width:100%;text-align:left;border-radius:16px;padding:12px 16px;margin-bottom:16px;
  background:linear-gradient(135deg,var(--navy-2) 0%,var(--navy) 100%);border:1.5px solid var(--brass);color:var(--ivory)}
.potline .lbl{flex-basis:100%;color:var(--brass);font-weight:700;font-size:14px}
.potline .amt{font:800 40px/1 var(--display);letter-spacing:-.02em}
.potline .grow{font:600 20px/1 var(--display);color:var(--orange)}
.pot{border-radius:18px;padding:16px;margin-bottom:16px;color:var(--ivory);
  background:linear-gradient(135deg,var(--navy-2) 0%,var(--navy) 100%);border:1.5px solid var(--brass);position:relative;overflow:hidden}
.pot .lbl{color:var(--brass);font-weight:700;font-size:15px}
.pot .amt{font:800 56px/1 var(--display);letter-spacing:-.02em;margin:4px 0 6px}
.pot p{color:#C9D3E4;font-size:14px;max-width:44ch}
.pot .splits{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pot .splits div{background:rgba(255,249,236,.08);border-radius:10px;padding:6px 10px;font-size:13px;color:#C9D3E4}
.pot .splits b{display:block;color:var(--ivory);font:800 18px/1.1 var(--display)}

.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:14px 0 6px}
.podium .step{background:var(--sand);border-radius:14px 14px 6px 6px;padding:12px 6px 10px;text-align:center;min-width:0}
.podium .step.first{background:#FBEFD3;padding-top:16px;border:1.5px solid var(--brass)}
.podium .chip{margin:0 auto 6px}
.podium .pid{font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;margin:0 auto}
.podium .w{color:var(--good);font:800 20px/1.2 var(--display)}
.podium .pts{font-size:12px;color:var(--mute)}

/* ---------- controls ---------- */
select,input[type=text],input[type=password],input[type=date],input[type=email],input[type=search]{
  border:1.5px solid #CFC5AE;background:#fff;border-radius:10px;padding:9px 11px;min-height:42px;max-width:100%}
label.f{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.field{margin-bottom:12px}
.field input{width:100%}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;min-height:44px;background:var(--ink);color:var(--ivory)}
.btn.red{background:var(--chip)}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{min-height:34px;padding:6px 11px;font-size:14px}
.btn.wide{width:100%;margin-top:12px}
.btn:disabled{opacity:.45;cursor:default}
.linkish{background:none;border:0;padding:0;color:#2F5B82;text-decoration:underline;font-weight:700}
.pid{background:none;border:0;padding:0;font-weight:700;color:inherit;text-align:left;text-decoration:underline;text-decoration-color:#CFC5AE;text-underline-offset:3px;overflow-wrap:anywhere}
.pid:hover{text-decoration-color:var(--chip)}
.seg{display:inline-flex;background:var(--felt);border-radius:999px;padding:3px;border:1px solid #8CB0D8}
.seg button{border:0;background:transparent;color:#DCE7F5;padding:8px 16px;border-radius:999px;font-weight:700;font-size:15px}
.seg button[aria-pressed=true]{background:var(--brass);color:var(--navy)}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1}
.seg.light{background:#EFE7D3;border-color:#E2D8BF}
.seg.light button{color:var(--mute)}
.seg.light button[aria-pressed=true]{background:var(--ink);color:var(--ivory)}
.seg.grid2{display:grid;grid-template-columns:1fr 1fr;border-radius:16px;width:100%;max-width:420px}
.seg.grid2 button{border-radius:12px}
.seg.grid2 button:last-child:nth-child(odd){grid-column:1/-1}
textarea{border:1.5px solid #CFC5AE;background:#fff;border-radius:10px;padding:9px 11px;width:100%;font:inherit;resize:vertical}
.preview{width:100%;border:1.5px solid var(--rule);border-radius:10px;background:#fff;height:420px;margin-top:10px}

/* period navigator */
.nav{display:flex;align-items:center;gap:8px;margin:12px 0 14px}
.nav select{flex:1;min-width:0;background:var(--felt);color:var(--ivory);border-color:#8CB0D8;font-weight:700;text-align:center;text-align-last:center}
.arrow{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid #E3ECF7;background:transparent;color:var(--ivory);display:grid;place-items:center}
.arrow svg{width:22px;height:22px}
.arrow:disabled{opacity:.3;cursor:default}

/* ---------- chips ---------- */
.chip{--c:#fff;--e:#B7AD96;--t:var(--ink);flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,var(--c) 0 58%,transparent 59%),repeating-conic-gradient(var(--e) 0 22.5deg,var(--c) 22.5deg 45deg);
  border:2px solid var(--e);font:800 15px/1 var(--display);color:var(--t)}
.chip.p1,.chip.p2,.chip.p3{--c:var(--chip);--e:var(--chip-deep);--t:#fff;
  background:radial-gradient(circle,var(--chip) 0 56%,transparent 57%),repeating-conic-gradient(#fff 0 22.5deg,var(--chip) 22.5deg 45deg)}
.chip.toc{--c:#F6E9C8;--e:var(--brass)}
.chip.big{width:52px;height:52px;font-size:20px}

/* ---------- lists ---------- */
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .sub{font-size:13px;color:var(--mute)}
.li .val{text-align:right;font-weight:700;white-space:nowrap}
.li .val small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.li.me{background:#FFF1C9;margin:0 -16px;padding-left:16px;padding-right:16px}
.won{color:var(--good);font-weight:700}
.cols{display:flex;gap:12px;padding:0 0 6px 50px;margin-top:10px;border-bottom:2px solid var(--rule);font-size:12px;font-weight:700;color:var(--mute)}
.cols span:first-child{flex:1}
.li .c,.cols .c{flex:none;width:52px;text-align:right;font-weight:700}
.li .c.w,.cols .c.w{width:70px}
.li .c.w{color:var(--good)}
.li .c.zero{color:#B9B09A;font-weight:400}
.li .tb{display:block;color:var(--brass-deep);font-size:12px;line-height:1.3;margin-top:1px}
.cut{display:flex;align-items:center;gap:10px;margin:6px 0;color:var(--brass-deep);font-weight:700;font-size:13px;text-align:center}
.cut::before,.cut::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--brass) 0 8px,transparent 8px 13px)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;font-size:13px;color:var(--mute);font-weight:700;padding:6px;border-bottom:2px solid var(--rule);white-space:nowrap}
table.t td{padding:8px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
table.t .r{text-align:right}
table.t .hl{background:#FFF1C9}
table.t th.hl{color:var(--ink)}
.scrollx{overflow-x:auto;margin:0 -16px;padding:0 16px}
.sticky1 th:first-child,.sticky1 td:first-child{position:sticky;left:0;background:var(--paper);z-index:1}

/* ---------- stats / money ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sand);border-radius:12px;padding:10px 10px 9px}
.stat b{display:block;font:800 22px/1.05 var(--display);overflow-wrap:anywhere}
.stat span{font-size:13px;color:var(--mute)}
.money{border:2px solid var(--ink);border-radius:14px;padding:14px;margin-top:14px}
.money .big{font:800 34px/1 var(--display)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.lock{background:var(--sand);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:15px}

/* ---------- history ---------- */
.find{display:flex;align-items:center;gap:6px;background:var(--felt);border:1.5px solid #8CB0D8;border-radius:999px;padding:2px 4px 2px 12px;width:min(210px,52vw)}
.find svg{width:18px;height:18px;flex:none;color:var(--felt-text)}
.find input{border:0;background:transparent;color:var(--ivory);min-height:36px;padding:4px;width:100%;outline:none}
.find input::placeholder{color:#B9CDE6}
.find:focus-within{border-color:var(--brass)}
.prof-head{display:flex;align-items:center;gap:14px}
.prof-head h2{font-size:28px;overflow-wrap:anywhere}

.badges{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:16px -16px 2px;padding:2px 16px 10px;scrollbar-width:thin}
.badge{scroll-snap-align:start;flex:none;width:96px;border-radius:12px;padding:8px 6px 8px;text-align:center;background:var(--sand);border:1.5px solid var(--rule)}
.badge .med{width:38px;height:38px;margin:0 auto 5px;border-radius:50%;display:grid;place-items:center;color:#fff;
  --m:var(--felt);--r:#fff;
  background:radial-gradient(circle,var(--m) 0 55%,transparent 56%),repeating-conic-gradient(var(--r) 0 20deg,var(--m) 20deg 40deg);
  box-shadow:0 0 0 1.5px var(--m)}
.badge .med svg{width:18px;height:18px}
.badge b{display:block;font:800 12.5px/1.15 var(--display)}
.badge .yr{font:800 15px/1.2 var(--display);color:var(--ink)}
.badge small{display:block;font-size:11px;color:var(--mute);line-height:1.3;margin-top:2px}
.badge.gold{background:#FBEFD3;border-color:var(--brass)}
.badge.gold .med{--m:var(--brass);--r:#FFF6DD;color:var(--ink)}
.badge.red .med{--m:var(--chip);--r:#fff}
.badge.ivory .med{--m:var(--navy);--r:var(--ivory)}
.badge.felt .med{--m:#2F5B82;--r:#DCE7F5}

/* ---------- payouts ---------- */
.calc{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.stepper button{width:46px;height:46px;border:0;background:var(--ink);color:var(--ivory);font-size:24px;font-weight:700}
.stepper output{min-width:58px;text-align:center;font:800 26px/1 var(--display)}
.potbig{font:800 40px/1 var(--display)}

/* ---------- rules ---------- */
.rules h2{margin-bottom:8px}
.rules p+p,.rules ul+p,.rules p+ul{margin-top:8px}
.rules ul{margin:8px 0 0;padding-left:20px}
.rules li{margin:4px 0}
.rules .callout{background:var(--sand);border-radius:12px;padding:10px 12px;margin-top:10px}
.mono{font-family:var(--display);font-weight:800;letter-spacing:.02em}

/* ---------- bottom nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);border-top:1px solid #2A3D5E;
  display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;width:100%;max-width:600px}
nav.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:6px 1px;color:#9AA8C2;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current=page]{color:var(--brass);background:var(--navy-2)}

/* ---------- manager ---------- */
.entry .li{gap:8px;flex-wrap:wrap}
.entry .place{width:30px;text-align:center;font:800 18px/1 var(--display)}
.entry .ctrls{display:flex;gap:6px;align-items:center;width:100%;padding-left:42px}
.entry .ctrls .paidbox{margin-right:auto}
.combo{position:relative}
.combo-box{position:relative;display:flex;align-items:center}
.combo-box input{width:100%;padding-right:46px;position:relative;z-index:1;background:transparent}
.combo-box .ghost{position:absolute;left:0;top:0;right:46px;bottom:0;padding:9px 11px;border:1.5px solid transparent;white-space:pre;overflow:hidden;
  color:#9AA3B5;pointer-events:none;font:inherit;line-height:normal;display:flex;align-items:center;background:#fff;border-radius:10px}
.combo-box .ghost i{font-style:normal;color:transparent}
.combo-toggle{position:absolute;right:4px;z-index:2;width:38px;height:34px;border:0;border-radius:8px;background:var(--sand);color:var(--ink);display:grid;place-items:center}
.combo-toggle svg{width:18px;height:18px}
.picklist{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:1.5px solid #CFC5AE;border-radius:12px;
  box-shadow:0 14px 30px -12px rgba(20,34,58,.45);max-height:320px;overflow:auto;z-index:20}
.picklist li{display:flex;align-items:baseline;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer}
.picklist li b{font-weight:700}
.picklist li span{color:var(--mute);font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picklist li small{color:var(--mute);font-size:12px;white-space:nowrap}
.picklist li[aria-selected=true]{background:#E4ECF7}
.picklist li.hd{cursor:default;padding:8px 10px 2px;font-size:12px;font-weight:700;color:var(--mute)}
.picklist li.more{justify-content:center;color:#2F5B82;font-weight:700;font-size:14px}
.picklist li.stale b{color:var(--mute)}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1.5px solid #CFC5AE;background:#fff;display:grid;place-items:center;font-weight:800;line-height:1}
.paidbox{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mute)}
.paidbox input{width:20px;height:20px;accent-color:var(--good)}
.paysel{min-height:34px!important;padding:4px 8px!important;font-size:14px;font-weight:700;border-radius:8px!important;margin-right:auto}
.paysel.st-unpaid{color:var(--bad);border-color:#E3B3AF!important;background:#FDF2F1}
.paysel.st-paid{color:var(--good);border-color:#A9D3B9!important;background:#EFF8F2}
.paysel.st-witheld{color:#2F5B82;border-color:#A9C1DD!important;background:#EEF3FA}
.paysel.st-requested{color:var(--brass-deep);border-color:#E2CD9E!important;background:#FBF4E4}
.banner{background:#FFF1C9;border:1.5px solid var(--brass);border-radius:12px;padding:10px 12px;font-size:15px}
.err{background:#FBE3E1;border:1.5px solid var(--bad);color:#6E1612;border-radius:12px;padding:10px 12px;font-size:15px}
.ok{background:#DFF2E7;border:1.5px solid var(--good);color:#0F4A2C;border-radius:12px;padding:10px 12px;font-size:15px}
.note-in{width:100%;margin-top:6px;min-height:34px!important;padding:5px 9px!important;font-size:14px}
.owed-item{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--rule);font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:#EFE7D3;color:var(--mute)}
.tag.on{background:#DFF2E7;color:var(--good)}

/* ---------- dialog ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,20,40,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.dialog{background:var(--paper);width:100%;max-width:460px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:rise .22s ease-out}
@media (min-width:600px){.scrim{align-items:center}.dialog{border-radius:20px}}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.pin{font:800 54px/1 var(--display);letter-spacing:.12em;margin:10px 0}

/* ---------- loader: poker-chip shuffle (Lottie), with a spinning chip until it loads ---------- */
.loader{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 0;color:var(--felt-text)}
.loader.inpaper{color:var(--mute);padding:18px 0}
.loader .anim{width:150px;height:150px;display:grid;place-items:center}
.loader .anim svg{width:100%!important;height:100%!important}
.spinchip{width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle,var(--chip) 0 52%,#fff 53% 57%,transparent 58%),repeating-conic-gradient(#fff 0 22.5deg,var(--chip) 22.5deg 45deg);
  box-shadow:0 0 0 3px var(--chip-deep);animation:flip 1.4s ease-in-out infinite}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.loader p{font-weight:700}
@media (prefers-reduced-motion:reduce){
  .spinchip{animation:none}
  .dialog{animation:none}
}
.refreshing{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--ivory);
  font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;display:flex;align-items:center;gap:8px;opacity:.92}
.refreshing i{width:12px;height:12px;border-radius:50%;border:2px solid var(--brass);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:16px 0;color:var(--mute)}
.hide{display:none!important}
</style>
</head>
<body>

<main id="view"></main>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div id="dialogRoot"></div>
<div id="refresh" class="refreshing hide" role="status"><i></i>Updating</div>



<script>
/* ===================== state ===================== */
const S = {
  snap:null, token:null, me:null, tab:'home',
  year:null, weekly:{}, standings:{},
  standMode:'season', weekIdx:0, month:null,
  players:14, profiles:{}, profileYear:null, histQuery:'', histErr:null,
  mgrTab:'entry', mgr:null, money:{}, moneyYear:'all', playerFilter:'',
  entry:{date:'', rows:[], editing:false, msg:null, busy:false}
};
const store={
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} }
};
const SNAP_KEY='ybp_snap_v2';

async function call(action,args){
  if(!/^https?:/.test(API_URL)) throw new Error('This app isn\'t connected to the league sheet yet. Paste the Apps Script /exec link into index.html where it says API_URL.');
  let res;
  try{
    res = await fetch(API_URL,{method:'POST',body:JSON.stringify({action,args:args||{},token:S.token||''})});
  }catch(e){ throw new Error('Couldn\'t reach the league sheet. Check your connection and try again.'); }
  let r; try{ r=await res.json(); }catch(e){ throw new Error('The league sheet sent back something unexpected. Try again in a moment.'); }
  if(!r.ok) throw new Error(r.error);
  return r.data;
}

const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_LONG=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pd=s=>{ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const dShort=s=>{ const d=pd(s); return MONTHS[d.getMonth()]+' '+d.getDate(); };
const dLong=s=>{ const d=pd(s); return DAYS[d.getDay()]+', '+MONTHS_LONG[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); };
const dMed=s=>{ const d=pd(s); return MONTHS[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear(); };
function money(n,signed){
  if(n==null) return '';
  const a=Math.abs(n), frac=Math.round(a*100)%100!==0;
  const s='$'+a.toLocaleString('en-US',{minimumFractionDigits:frac?2:0,maximumFractionDigits:2});
  return n<0?'−'+s:(signed&&n>0?'+':'')+s;
}
function ord(n){ const s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
const chip=(n,extra)=>`<span class="chip ${n<=3?'p'+n:''} ${extra||''}" aria-label="${ord(n)}">${n}</span>`;
const COLS=`<div class="cols" aria-hidden="true"><span>Player</span><span class="c">Points</span><span class="c w">Winnings</span></div>`;
const wonCell=w=>w?`<div class="c w num">${money(w)}</div>`:`<div class="c w zero">–</div>`;
const boardRow=(rank,id,sub,pts,won,chipCls)=>`<li class="li ${isMe(id)?'me':''}">${chip(rank,chipCls)}<div class="grow">${pid(id)}${sub?`<div class="sub num">${sub}</div>`:''}</div><div class="c num">${pts}</div>${wonCell(won)}</li>`;
const pid=id=>id?`<button class="pid" data-pid="${esc(id)}">${esc(id)}</button>`:'<span class="meta">Player not matched</span>';
const isMe=id=>S.me&&S.me.id&&String(S.me.id).toLowerCase()===String(id).toLowerCase();
const isMgr=()=>S.me&&S.me.role==='manager';
const errBox=e=>`<div class="err">${esc(e.message||e)}</div>`;
const LOAD_MSG=['Shuffling up…','Stacking chips…','Counting the pot…','Dealing the cards…'];
const loader=(msg,paper)=>`<div class="loader ${paper?'inpaper':''}" role="status"><div class="anim" aria-hidden="true"><span class="spinchip"></span></div><p>${esc(msg||LOAD_MSG[Math.floor(Math.random()*LOAD_MSG.length)])}</p></div>`;
const ARROW_L='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
const ARROW_R='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';

/* ===================== loading animation =====================
   Plays the "Poker Chip Shuffle" Lottie animation (by Chan, LottieFiles, Lottie Simple License).
   If you upload the animation's Lottie JSON to the repo as chip-shuffle.json, that copy is used;
   otherwise it's fetched from LottieFiles. Until it's ready, a spinning chip shows. */
const LOTTIE_SOURCES=['chip-shuffle.json','https://assets-v2.lottiefiles.com/a/0fa83084-e535-11ef-a1d5-ab864b5862bb/ucqpMUSzZG.lottie'];
let lottieData=null, lottieJob=null;
const noMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function loadScript(src){ return new Promise((ok,bad)=>{ const el=document.createElement('script'); el.src=src; el.onload=ok; el.onerror=bad; document.head.appendChild(el); }); }
function getLottie(){
  if(lottieData) return Promise.resolve(lottieData);
  if(lottieJob) return lottieJob;
  lottieJob=(async()=>{
    if(!window.lottie) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js');
    for(const src of LOTTIE_SOURCES){
      try{
        const r=await fetch(src); if(!r.ok) continue;
        if(/\.json$/.test(src)){ lottieData=await r.json(); return lottieData; }
        if(!window.JSZip) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
        const zip=await JSZip.loadAsync(await r.arrayBuffer());
        const name=Object.keys(zip.files).find(n=>/^(animations|a)\/[^/]+\.json$/.test(n));
        if(!name) continue;
        const data=JSON.parse(await zip.file(name).async('string'));
        for(const a of (data.assets||[])){
          if(!a.p||a.e===1||/^data:/.test(a.p)) continue;
          const f=zip.file('images/'+a.p)||zip.file('i/'+a.p);
          if(f){ const ext=(a.p.split('.').pop()||'png').toLowerCase(); a.p='data:image/'+(ext==='jpg'?'jpeg':ext)+';base64,'+await f.async('base64'); a.u=''; a.e=1; }
        }
        lottieData=data; return data;
      }catch(e){ /* try the next source */ }
    }
    throw new Error('animation unavailable');
  })();
  lottieJob.catch(()=>{ lottieJob=null; });
  return lottieJob;
}
function mountLoaders(){
  if(noMotion()) return;
  document.querySelectorAll('.loader .anim:not([data-on])').forEach(box=>{
    box.dataset.on='1';
    getLottie().then(data=>{
      if(!box.isConnected) return;
      box.innerHTML='';
      window.lottie.loadAnimation({container:box,renderer:'svg',loop:true,autoplay:true,animationData:JSON.parse(JSON.stringify(data))});
    }).catch(()=>{ /* keep the spinning chip */ });
  });
}
new MutationObserver(()=>mountLoaders()).observe(document.getElementById('view'),{childList:true,subtree:true});

/* ===================== payout math (mirrors the sheet) ===================== */
const cfg=()=>S.snap.config;
const bracketFor=n=>(S.snap.payouts||[]).find(b=>n>=b.min&&n<=b.max)||null;
const potFor=n=>Math.round(n*cfg().buyIn-n*cfg().tocFee);
function payoutFor(n,place){ const b=bracketFor(n); if(!b) return 0; const p=b.pct[place-1]; return p?Math.round(potFor(n)*p):0; }
const pointsFor=(n,place)=>n-(place-1)+(place===1?3:place===2?2:place===3?1:0);

/* ===================== data helpers ===================== */
async function getWeekly(y){ if(!S.weekly[y]) S.weekly[y]=await call('weekly',{year:y}); return S.weekly[y]; }
async function getStandings(y){ if(!S.standings[y]) S.standings[y]=await call('standings',{year:y}); return S.standings[y]; }
async function getProfile(id){
  const k=id.toLowerCase();
  if(!S.profiles[k]) S.profiles[k]=await call('player',{id});
  return S.profiles[k];
}
function applySnap(s){
  S.snap=s;
  S.weekly[s.currentYear]=s.weekly[s.currentYear];
  S.standings[s.currentYear]=s.standings[s.currentYear];
  if(!S.year) S.year=s.currentYear;
}

/* ===================== shell ===================== */
const ICONS={
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3"/></svg>',
  standings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11h4v9M10 20V5h4v15M16 20v-7h4v7M3 20h18"/></svg>',
  payouts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6.5 9.5v.01M17.5 14.5v.01"/></svg>',
  history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4.5a2.5 2.5 0 0 0 2.5 4M17 6h2.5a2.5 2.5 0 0 1-2.5 4"/></svg>',
  rules:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  manager:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>'
};
const TAB_LABEL={home:'Home',standings:'Standings',payouts:'Payouts',history:'History',rules:'Rules',manager:'Manager'};
const BADGE_ICONS={
  crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4.5a2.5 2.5 0 0 0 2.5 4M17 6h2.5a2.5 2.5 0 0 1-2.5 4"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  calendar:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  chip:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/>',
  flame:'<path d="M12 21c-4 0-6.5-2.6-6.5-6 0-4 3.5-6 3.5-10 2.5 1.5 4 4 4 6 1-1 1.5-2.5 1.5-3.5 2.5 2 4 4.7 4 7.5 0 3.4-2.5 6-6.5 6z"/>',
  ticket:'<path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/><path d="M14 7v10" stroke-dasharray="2 2"/>',
  stack:'<ellipse cx="12" cy="6" rx="7" ry="2.5"/><path d="M5 6v4c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6M5 10v4c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-4M5 14v4c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-4"/>'
};

function acctBtn(){
  return S.me
    ? `<button class="acct in" data-act="account">${isMgr()?'Manager':esc(S.me.id)}</button>`
    : `<button class="acct" data-act="signin">Sign in</button>`;
}
function renderTabs(){
  const tabs=['home','standings','payouts','history','rules'].concat(isMgr()?['manager']:[]);
  if(!tabs.includes(S.tab)){ S.tab='home'; pushNav(true); }
  $('#tabs').innerHTML=tabs.map(t=>`<button data-tab="${t}" ${S.tab===t?'aria-current="page"':''}>${ICONS[t]}${TAB_LABEL[t]}</button>`).join('');
}
function go(tab,replace){ S.tab=tab; pushNav(replace); renderTabs(); render(); window.scrollTo(0,0); }

/* Phone back button: every page change is added to the browser history, so Back
   returns to the previous page (or closes an open pop-up) instead of leaving the app. */
const navState=()=>({tab:S.tab,mode:S.standMode,q:S.histQuery||'',mgr:S.mgrTab});
function hashFor(st){
  if(st.tab==='standings') return '#standings/'+st.mode;
  if(st.tab==='history') return '#history'+(st.q?'/'+encodeURIComponent(st.q):'');
  if(st.tab==='manager') return '#manager/'+st.mgr;
  return '#'+st.tab;
}
function parseHash(){
  const [tab,sub]=decodeURIComponent(location.hash.slice(1)).split(/\/(.*)/s);
  const st=navState();
  if(!TAB_LABEL[tab]) return Object.assign(st,{tab:'home'});
  st.tab=tab;
  if(tab==='standings'&&['week','month','season'].includes(sub)) st.mode=sub;
  if(tab==='history') st.q=sub||'';
  if(tab==='manager'&&sub) st.mgr=sub;
  return st;
}
function pushNav(replace){
  const st=navState(), cur=history.state&&history.state.nav;
  S.navCur=st;
  if(!replace&&cur&&JSON.stringify(cur)===JSON.stringify(st)) return;
  try{ history[replace?'replaceState':'pushState']({nav:st},'',hashFor(st)); }catch(e){}
}
function applyNav(st){
  S.tab=st.tab; if(st.mode) S.standMode=st.mode;
  if((st.q||'')!==(S.histQuery||'')){ S.histQuery=st.q||''; S.profileYear=null; S.logAll=false; }
  if(st.mgr) S.mgrTab=st.mgr;
  S.navCur=st;
}
window.addEventListener('popstate',e=>{
  const dlg=$('#dialogRoot');
  if(dlg.innerHTML){ dlg.innerHTML=''; return; }            // Back closes the pop-up, page stays
  const st=(e.state&&e.state.nav)||parseHash();
  if(S.navCur&&JSON.stringify(st)===JSON.stringify(S.navCur)){ history.back(); return; } // skip a leftover duplicate
  applyNav(st);
  renderTabs(); render(); window.scrollTo(0,0);
});

let renderSeq=0;
async function render(){
  const v=$('#view'); const seq=++renderSeq;
  if(!S.snap){ v.innerHTML=loader(); return; }
  try{
    const html = await VIEWS[S.tab](v, seq);
    if(seq!==renderSeq || html==null) return;
    v.innerHTML=html; v.dataset.seq=seq;
    if(AFTER[S.tab]) AFTER[S.tab]();
  }catch(e){ v.dataset.seq=seq; if(seq===renderSeq) v.innerHTML=`<div class="page-head"><h1>${TAB_LABEL[S.tab]}</h1>${acctBtn()}</div><div class="sheet">${errBox(e)}</div>`; }
}
/* show a loader only if a fetch is actually slow */
function slow(v,seq,msg,head){ setTimeout(()=>{ if(seq===renderSeq && v.dataset.seq!==String(seq)) v.innerHTML=(head||'')+loader(msg); },150); }

/* ===================== Home ===================== */
const VIEWS={}, AFTER={};
VIEWS.home=function(){
  const s=S.snap, y=s.currentYear, st=s.standings[y], wk=s.weekly[y]||[], g=wk[0], pot=s.tocPot, c=cfg();
  const top=st.players.slice(0,15);
  const rows=[];
  top.forEach((p,i)=>{
    if(i>0&&top[i-1].rank<=st.tocSpots&&p.rank>st.tocSpots) rows.push(`<li class="cut" aria-hidden="true">Top ${st.tocSpots} make the Tournament of Champions</li>`);
    rows.push(boardRow(p.rank,p.id,p.games+' games',p.pts,p.won,p.rank<=st.tocSpots&&p.rank>3?'toc':''));
  });
  let latest='';
  if(g){
    const r=g.results, at=i=>r[i]||null;
    const step=(x,cls)=>x?`<div class="step ${cls}">${chip(x.place,'big')}${pid(x.id)}${x.win?`<div class="w num">${money(x.win)}</div>`:''}<div class="pts num">${x.pts} pts</div></div>`:'<div></div>';
    latest=`<section class="sheet">
      <h2>Latest tournament</h2>
      <p class="meta num" style="margin-top:4px">${dLong(g.date)}. ${g.players} players, ${money(g.pot)} prize pool.</p>
      <div class="podium">${step(at(1),'')}${step(at(0),'first')}${step(at(2),'')}</div>
      ${r.length>3?COLS:''}<ol class="list" start="4">${r.slice(3).map(x=>boardRow(x.place,x.id,'',x.pts,x.win,'')).join('')}</ol>
      <button class="btn line wide" data-goto="week">All weekly results</button>
    </section>`;
  }
  return `
  <header class="hero">
    <img class="logo" src="logo.webp" width="520" height="483" alt="">
    <h1 class="sr-only">YeahBuddy Poker</h1>
    ${acctBtn()}
  </header>
  <button class="potline" data-goto="pot" aria-label="${pot.year} Tournament of Champions pot ${money(pot.collected)} and growing. See details on the Payouts page.">
    <span class="lbl">${pot.year} Tournament Of Champions pot</span>
    <span class="amt num">${money(pot.collected)}</span><span class="grow">and growing</span>
  </button>
  <section class="sheet">
    <div class="spread"><h2>${y} leaderboard</h2>${st.lastGame?`<span class="meta">Through ${dShort(st.lastGame)}</span>`:''}</div>
    ${COLS}<ol class="list">${rows.join('')||'<li class="empty">The season hasn\'t started yet.</li>'}</ol>
    <button class="btn wide" data-goto="season">View more</button>
  </section>
  ${latest}`;
};

/* ===================== Standings ===================== */
function navBar(options, value, canPrev, canNext){
  return `<div class="nav">
    <button class="arrow" data-nav="-1" aria-label="Earlier" ${canPrev?'':'disabled'}>${ARROW_L}</button>
    <select id="navSel" aria-label="Choose a time period">${options.map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(value)?'selected':''}>${esc(o.t)}</option>`).join('')}</select>
    <button class="arrow" data-nav="1" aria-label="Later" ${canNext?'':'disabled'}>${ARROW_R}</button>
  </div>`;
}
VIEWS.standings=async function(v,seq){
  const years=S.snap.years, y=S.year, mode=S.standMode;
  const head=`<div class="page-head"><h1>Standings</h1>${acctBtn()}</div>
    <div class="seg full" role="group" aria-label="Time frame">
      ${['week','month','season'].map(m=>`<button data-mode="${m}" aria-pressed="${mode===m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}
    </div>`;
  const oldest=years[years.length-1], newest=years[0];
  if(mode==='week'){
    slow(v,seq,'Dealing the results…',head);
    const wk=await getWeekly(y);
    if(S.weekIdx<0) S.weekIdx=wk.length-1+1+S.weekIdx; // -1 = last (oldest)
    S.weekIdx=Math.max(0,Math.min(S.weekIdx,wk.length-1));
    const g=wk[S.weekIdx];
    const opts=wk.map((x,i)=>({v:i,t:dMed(x.date)}));
    const canPrev=S.weekIdx<wk.length-1||y>oldest, canNext=S.weekIdx>0||y<newest;
    return head+navBar(opts,S.weekIdx,canPrev,canNext)+`<section class="sheet" data-swipe>
      ${!g?`<p class="empty">No games in ${y}.</p>`:`
      <h2>${dLong(g.date)}</h2><p class="meta num" style="margin-top:4px">${g.players} players, ${money(g.pot)} prize pool</p>
      ${COLS}<ol class="list">${g.results.map(r=>boardRow(r.place,r.id,'',r.pts,r.win,'')).join('')}</ol>`}
    </section>`;
  }
  if(mode==='month'){
    slow(v,seq,'Adding up the month…',head);
    const st=await getStandings(y);
    if(!st.months.length){
      return head+navBar(years.map(x=>({v:x,t:String(x)})),y,y>oldest,y<newest)+`<section class="sheet" data-swipe><h2>${y}</h2><p class="empty">Month-by-month standings start with the 2025 season, when today's scoring rules began. Season totals for ${y} are under Season.</p></section>`;
    }
    if(!S.month||!st.months.some(m=>m.m===S.month)) S.month=st.months[st.months.length-1].m;
    const mi=st.months.findIndex(m=>m.m===S.month), M=st.months[mi];
    const list=st.players.filter(p=>p.months&&p.months[S.month]).map(p=>Object.assign({id:p.id},p.months[S.month]));
    list.sort((a,b)=>b.pts-a.pts||a.id.localeCompare(b.id));
    list.forEach((p,i)=>{ p.rank=i>0&&list[i-1].pts===p.pts?list[i-1].rank:i+1; });
    const opts=st.months.map(m=>({v:m.m,t:MONTHS_LONG[Number(m.m)-1]+' '+y}));
    return head+navBar(opts,S.month,mi>0||y>oldest,mi<st.months.length-1||y<newest)+`<section class="sheet" data-swipe>
      <h2>${MONTHS_LONG[Number(M.m)-1]} ${y}</h2><p class="meta num" style="margin-top:4px">${M.games} games this month</p>
      ${COLS}<ol class="list">${list.map(p=>boardRow(p.rank,p.id,`${p.games} of ${M.games} games${p.dropped!=null?`, dropped a ${p.dropped}`:''}`,p.pts,p.won,'')).join('')}</ol>
      <p class="hint">In a month with ${cfg().minGamesForDrop} or more games, players who play every game drop their lowest score.</p>
    </section>`;
  }
  slow(v,seq,'Adding up points…',head);
  const st=await getStandings(y);
  const rows=[];
  st.players.forEach((p,i)=>{
    if(i>0&&st.players[i-1].rank<=st.tocSpots&&p.rank>st.tocSpots) rows.push(`<li class="cut" aria-hidden="true">Top ${st.tocSpots} ${st.isCurrent?'make':'made'} the Tournament of Champions</li>`);

AFTER.standings=function(){
  const sel=$('#navSel'); if(sel) sel.onchange=()=>{
    if(S.standMode==='week') S.weekIdx=Number(sel.value);
    else if(S.standMode==='month' && S.standings[S.year] && S.standings[S.year].months.length) S.month=sel.value;
    else S.year=Number(sel.value);

  };
  bindSwipe();

/* dir: -1 earlier, +1 later */
async function stepPeriod(dir){
  if($('#view').dataset.seq!==String(renderSeq)) return; // still loading the last step
  const years=S.snap.years, y=S.year;
  if(S.standMode==='season'){ const ny=y+dir; if(years.includes(ny)){ S.year=ny; render(); } return; }
  if(S.standMode==='week'){
    const wk=S.weekly[y]||[]; const ni=S.weekIdx-dir; // list is newest first
    if(ni>=0&&ni<wk.length){ S.weekIdx=ni; return render(); }
    const ny=y+dir; if(!years.includes(ny)) return;
    S.year=ny; S.weekIdx=dir<0?0:-1; return render();
  }
  const st=S.standings[y];
  if(st&&st.months.length){
    const mi=st.months.findIndex(m=>m.m===S.month)+dir;
    if(mi>=0&&mi<st.months.length){ S.month=st.months[mi].m; return render(); }
  }
  const ny=y+dir; if(!years.includes(ny)) return;
  S.year=ny; S.month=null;
  const nst=await getStandings(ny).catch(()=>null);
  if(nst&&nst.months.length) S.month=dir<0?nst.months[nst.months.length-1].m:nst.months[0].m;
  render();
}
function bindSwipe(){
  const el=document.querySelector('[data-swipe]'); if(!el) return;
  let x0=null,y0=null;
  el.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0==null) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5) stepPeriod(dx<0?1:-1);
  },{passive:true});
}

/* ---------- payment status ----------
   Not paid  -> G blank,  H blank
   Paid      -> G "x",    H blank
   Withheld  -> G "x",    H "witheld"   (taken out of their winnings, so it counts as paid)
   Requested -> G blank,  H "requested" (Venmo request sent; mark paid later from Payments)
   Any extra note is kept after the word, e.g. "requested - paid for him last time". */
const PAY_OPTS=[['unpaid','Not paid'],['paid','Paid'],['witheld','Withheld'],['requested','Requested']];
function rowFromSheet(r){
  const raw=String(r.note||'').trim(), low=raw.toLowerCase();
  let status=r.paid?'paid':'unpaid', note=raw;
  const m=low.match(/^(wit+h?h?e+ld|wothe[^\s.,-]*|with?eld|requ?e?s?t?e?d?|reque[^\s.,-]*|requs[^\s.,-]*)\b[\s.,:;-]*/);
  if(m&&/^(wit|wot)/.test(m[1])){ status='witheld'; note=raw.slice(m[0].length); }
  else if(m&&/^req/.test(m[1])){ status=r.paid?'paid':'requested'; note=r.paid?raw:raw.slice(m[0].length); }
  return {id:r.id,status,note:note.trim()};
}
function rowToSheet(r){
  const word=r.status==='witheld'?'witheld':r.status==='requested'?'requested':'';
  const note=[word,(r.note||'').trim()].filter(Boolean).join(' - ');
  return {paid:r.status==='paid'||r.status==='witheld',note};
}

/* ---------- player picker: recent players first, type-ahead, dropdown ---------- */
const ACTIVE_DAYS=120;
function pickerPool(){
  const today=pd(S.mgr.today), cutoff=new Date(today.getTime()-ACTIVE_DAYS*864e5);
  const recent={};
  new Set(Object.values(S.weekly).concat([S.snap.weekly[S.snap.currentYear]])).forEach(wk=>(wk||[]).forEach(g=>{
    if(pd(g.date)>=cutoff) g.results.forEach(r=>{ recent[r.id]=(recent[r.id]||0)+1; });
  }));
  const ids=new Set();
  return S.mgr.players.filter(p=>{ const k=p.id.toLowerCase(); if(ids.has(k)) return false; ids.add(k); return true; }).map(p=>({
    id:p.id, name:[p.first,p.last].filter(Boolean).join(' '), first:(p.first||'').toLowerCase(), last:(p.last||'').toLowerCase(),
    lastPlayed:p.lastPlayed||'', recent:recent[p.id]||0,
    active:!!p.lastPlayed&&pd(p.lastPlayed)>=cutoff
  }));
}
const byRecent=(a,b)=>(b.active-a.active)||(b.recent-a.recent)||(b.lastPlayed||'').localeCompare(a.lastPlayed||'')||a.id.localeCompare(b.id);
function pickMatches(q){
  const taken=new Set(S.entry.rows.map(r=>r.id.toLowerCase()));
  const pool=pickerPool().filter(p=>!taken.has(p.id.toLowerCase()));
  q=q.trim().toLowerCase();
  if(!q){
    const act=pool.filter(p=>p.active).sort(byRecent), old=pool.filter(p=>!p.active).sort(byRecent);
    return {list:S.pickAll?act.concat(old):act, hidden:S.pickAll?0:old.length};
  }
  const scored=[];
  pool.forEach(p=>{
    const id=p.id.toLowerCase(), nm=p.name.toLowerCase();
    let sc=null;
    if(id.startsWith(q)) sc=0; else if(p.first.startsWith(q)||p.last.startsWith(q)||nm.startsWith(q)) sc=1;
    else if(id.includes(q)) sc=2; else if(nm.includes(q)) sc=3;
    if(sc!=null) scored.push(Object.assign({sc},p));
  });
  scored.sort((a,b)=>(b.active-a.active)||(a.sc-b.sc)||byRecent(a,b));
  return {list:scored.slice(0,15), hidden:0};
}
function bindPicker(){
  const inp=$('#addId'), list=$('#pickList'), ghost=$('#addGhost'), tog=$('#pickToggle'), addBtn=$('#addBtn');
  if(!inp) return;
  let items=[], idx=-1, open=false;
  const close=()=>{ open=false; list.classList.add('hide'); inp.setAttribute('aria-expanded','false'); inp.removeAttribute('aria-activedescendant'); };
  const paintGhost=()=>{
    const v=inp.value, top=items[0];
    if(v&&top&&top.id.toLowerCase().startsWith(v.toLowerCase())&&top.id.length>v.length&&open){
      ghost.innerHTML=`<i>${esc(v)}</i>${esc(top.id.slice(v.length))}`;
    } else ghost.innerHTML='';
  };
  const draw=()=>{
    const m=pickMatches(inp.value); items=m.list;
    if(idx>=items.length) idx=items.length-1;
    if(inp.value&&idx<0&&items.length) idx=0;
    let html='', lastAct=null;
    const blank=!inp.value.trim();
    items.forEach((p,i)=>{
      if(blank&&p.active!==lastAct){ html+=`<li class="hd" role="presentation">${p.active?'Played recently':'Not played lately'}</li>`; lastAct=p.active; }
      html+=`<li role="option" id="pk${i}" data-i="${i}" aria-selected="${i===idx}" class="${p.active?'':'stale'}"><b>${esc(p.id)}</b><span>${esc(p.name)}</span><small>${p.lastPlayed?(p.active?dShort(p.lastPlayed):MONTHS[pd(p.lastPlayed).getMonth()]+' '+p.lastPlayed.slice(0,4)):'new'}</small></li>`;
    });
    if(m.hidden) html+=`<li class="more" data-more="1" role="option">Show ${m.hidden} players who haven't played lately</li>`;
    if(!items.length&&!m.hidden) html=`<li class="hd" role="presentation">${inp.value?'No match. Press Add to use it anyway, or add a new player.':'Everyone is already on the list.'}</li>`;
    list.innerHTML=html;
    open=true; list.classList.remove('hide'); inp.setAttribute('aria-expanded','true');
    if(idx>=0){ inp.setAttribute('aria-activedescendant','pk'+idx); const el=list.querySelector('#pk'+idx); if(el) el.scrollIntoView({block:'nearest'}); }
    paintGhost();
  };
  const choose=id=>{ inp.value=''; idx=-1; addFinisher(id); };
  // The list opens when you tap the box, type, or use the arrow, not when focus returns after adding someone,
  // so it never covers the Paid boxes below.
  inp.addEventListener('click',()=>{ if(!open){ idx=-1; draw(); } });
  inp.addEventListener('input',()=>{ idx=inp.value?0:-1; draw(); });
  inp.addEventListener('blur',()=>setTimeout(()=>{ if(document.activeElement!==inp) { close(); ghost.innerHTML=''; } },120));
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); if(!open) draw(); idx=Math.min(items.length-1,idx+1); draw(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); idx=Math.max(0,idx-1); draw(); }
    else if(e.key==='Escape'){ close(); ghost.innerHTML=''; }
    else if((e.key==='Tab'||e.key==='ArrowRight')&&ghost.innerHTML&&inp.selectionStart===inp.value.length){ e.preventDefault(); inp.value=items[0].id; idx=0; draw(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(open&&idx>=0&&items[idx]) choose(items[idx].id); else if(inp.value.trim()) choose(resolveId(inp.value)); }
  });
  list.addEventListener('pointerdown',e=>e.preventDefault()); // keep the keyboard up
  list.addEventListener('click',e=>{
    const li=e.target.closest('li'); if(!li) return;
    if(li.dataset.more){ S.pickAll=true; draw(); return; }
    if(li.dataset.i!=null) choose(items[+li.dataset.i].id);
  });
  tog.addEventListener('pointerdown',e=>e.preventDefault());
  tog.addEventListener('click',()=>{ if(open&&!inp.value){ close(); return; } inp.focus(); inp.value=''; idx=-1; draw(); });
  addBtn.addEventListener('click',()=>{ const v=inp.value.trim(); if(!v){ inp.focus(); return; } choose(open&&idx>=0&&items[idx]?items[idx].id:resolveId(v)); });
}
function addFinisher(id){
  const E=S.entry; if(!id) return;
  if(E.rows.some(r=>r.id.toLowerCase()===id.toLowerCase())){ E.msg=errBox(id+' is already on the list.'); return render(); }
  const known=S.mgr.players.some(p=>p.id.toLowerCase()===id.toLowerCase());
  E.rows.push({id,status:'unpaid',note:''}); E.dirty=true;
  E.msg=known?null:`<div class="banner">${esc(id)} isn't a known Player ID. Check the spelling, or <button class="linkish" data-act="newplayer-entry">add them as a new player</button>.</div>`;
  S.pickAll=false;
  render().then(()=>{ const i=$('#addId'); if(i) i.focus(); });
}
function resolveId(raw){
  const q=raw.trim().toLowerCase(); if(!q) return null;
  const ps=S.mgr.players;
  let p=ps.find(x=>x.id.toLowerCase()===q)||ps.find(x=>[x.first,x.last].filter(Boolean).join(' ').toLowerCase()===q);
  if(!p){ const m=ps.filter(x=>(x.first||'').toLowerCase()===q); if(m.length===1) p=m[0]; }
  return p?p.id:raw.trim();
}

  const E=S.entry; E.date=d; E.msg=null; E.rows=[]; E.editing=false; E.savedAt=null; E.dirty=false;

function killDialog(){
  $('#dialogRoot').innerHTML='';
  if(history.state&&history.state.dialog){ try{ history.replaceState({nav:S.navCur},'',hashFor(S.navCur)); }catch(e){} }
}
function openDialog(html,onMount){
  const root=$('#dialogRoot'), prev=document.activeElement;
  root.innerHTML=`<div class="scrim" data-close="1"><div class="dialog" role="dialog" aria-modal="true">${html}</div></div>`;
  const close=()=>{ killDialog(); document.removeEventListener('keydown',k); if(prev&&prev.focus) prev.focus(); };
  if(!(history.state&&history.state.dialog)){ try{ history.pushState({nav:S.navCur,dialog:1},'',hashFor(S.navCur)); }catch(e){} }
  const k=e=>{ if(e.key==='Escape') close(); };
  document.addEventListener('keydown',k);
  root.querySelector('.scrim').addEventListener('click',e=>{ if(e.target.dataset.close||e.target.closest('[data-dismiss]')) close(); });
  if(onMount) onMount(root,close);
  const f=root.querySelector('input:not([readonly]),button'); if(f) f.focus();
}
function confirmDialog(title,text,okLabel,fn){
  openDialog(`<h2>${esc(title)}</h2><p style="margin:10px 0 14px">${esc(text)}</p><div class="row"><button class="btn red" id="dlgOk">${esc(okLabel)}</button><button class="btn line" data-dismiss>Cancel</button></div>`,
    (root,close)=>{ root.querySelector('#dlgOk').onclick=()=>{ close(); fn(); }; });
}
function signInDialog(){
  let kind='player';
  const draw=(root,close)=>{
    const d=root.querySelector('.dialog');
    d.innerHTML=`<h2>Sign in</h2>
      <div class="seg light" role="group" aria-label="Sign in as" style="margin:14px 0">
        <button type="button" data-kind="player" aria-pressed="${kind==='player'}">Player</button>
        <button type="button" data-kind="manager" aria-pressed="${kind==='manager'}">Manager</button></div>
      <form id="signForm">
        ${kind==='player'?`
          <div class="field"><label class="f" for="si_id">Player ID</label><input id="si_id" type="text" list="pids2" autocapitalize="off" autocorrect="off" autocomplete="username" required>
          <datalist id="pids2">${S.snap.playerIds.map(i=>`<option value="${esc(i)}">`).join('')}</datalist></div>
          <div class="field"><label class="f" for="si_pin">PIN</label><input id="si_pin" type="password" inputmode="numeric" autocomplete="current-password" required></div>
          <p class="hint" style="margin-top:-4px">Your PIN comes from the league manager. Signing in lets you see your own profit after buy-ins.</p>`
        :`<div class="field"><label class="f" for="si_pw">Manager password</label><input id="si_pw" type="password" autocomplete="current-password" required></div>`}
        <div id="si_err"></div>
        <div class="row" style="margin-top:10px"><button class="btn red" type="submit">Sign in</button><button class="btn line" type="button" id="si_cancel">Cancel</button></div>
      </form>`;
    d.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{ kind=b.dataset.kind; draw(root,close); });
    d.querySelector('#si_cancel').onclick=close;
    const first=d.querySelector('#si_id,#si_pw'); if(first) first.focus();
    d.querySelector('#signForm').onsubmit=async e=>{
      e.preventDefault();
      const btn=d.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='Signing in…';
      try{
        const r=await call('login',kind==='player'?{kind,id:d.querySelector('#si_id').value,pin:d.querySelector('#si_pin').value}:{kind,password:d.querySelector('#si_pw').value});
        S.token=r.token; store.set('ybp_token',r.token); store.set('ybp_me',JSON.stringify({role:r.role,id:r.id||''}));
        S.me={role:r.role,id:r.id||''}; S.profiles={}; S.histQuery=r.id||''; S.mgr=null;
        close(); renderTabs(); go(r.role==='manager'?'manager':'history');
      }catch(err){ d.querySelector('#si_err').innerHTML=errBox(err); btn.disabled=false; btn.textContent='Sign in'; }
    };
  };
  openDialog('',draw);
}
function welcomeText(p,pin){
  const c=cfg(), app=c.appUrl||location.href.split('#')[0];
  return `Hi ${p.first||'there'}! Thanks for joining ${c.clubName}. Here's how to get in the game:

1. Get PokerStars free: pokerstars.net on a computer, or the PokerStars app on your phone.
2. Open Home Games and choose Join a Poker Club.
3. Enter Club ID: ${c.clubId}
   Invitation Code: "${c.clubCode}"
   (type it exactly as shown, including the capitals and the exclamation point)
4. Once you're approved for the ${c.clubName} club, register for the tournament under My Scheduled Tournaments.

Games are ${c.gameDay}s at ${c.gameTime}. The buy-in is ${money(c.buyIn)}, paid on Venmo to ${c.venmo} before the game starts.

Get the league app for standings and results: ${app}
On iPhone, open it in Safari and tap Share, then Add to Home Screen. On Android, open it in Chrome and tap the ⋮ menu, then Add to Home screen.`+(pin?`

Your app sign-in: Player ID ${p.id}, PIN ${pin}`:'');
}
function welcomeDialog(p,justAdded){
  let pin=null;
  openDialog(`<h2>${justAdded?esc(p.id)+' is added':'Welcome text for '+esc(p.id)}</h2>
    <p class="meta" style="margin:6px 0 10px">Copy this and send it to them. You can edit it first.</p>
    <textarea id="wText" rows="12"></textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="wCopy">Copy text</button>
      <a class="btn line" id="wSms" style="text-decoration:none;display:inline-flex;align-items:center" href="#">Open in Messages</a>
      <button class="linkish" id="wPin">Add an app PIN</button>
    </div>
    <div class="row" style="margin-top:12px"><button class="btn line" data-dismiss>Done</button></div>`,
  root=>{
    const ta=root.querySelector('#wText'), sms=root.querySelector('#wSms');
    const sync=()=>{ sms.href='sms:?&body='+encodeURIComponent(ta.value); };
    ta.value=welcomeText(p); sync(); ta.oninput=sync;
    root.querySelector('#wCopy').onclick=async e=>{ try{ await navigator.clipboard.writeText(ta.value); e.target.textContent='Copied'; }catch(_){ ta.select(); e.target.textContent='Press and hold to copy'; } };
    root.querySelector('#wPin').onclick=async e=>{
      e.target.disabled=true; e.target.textContent='Making a PIN…';
      try{ const r=await call('mgr_setPin',{id:p.id}); pin=r.pin; ta.value=welcomeText(p,pin); sync(); e.target.textContent='PIN '+pin+' added'; S.mgr=await call('mgr_overview'); if(S.tab==='manager') render(); }
      catch(err){ e.target.disabled=false; e.target.textContent='Add an app PIN'; }
    };
  });
}
function accountDialog(){
  openDialog(`<h2>${isMgr()?'Signed in as manager':'Signed in as '+esc(S.me.id)}</h2>
    <div class="row" style="margin-top:16px">${!isMgr()?'<button class="btn" data-act="mystats">My history</button>':''}<button class="btn line" data-act="signout">Sign out</button></div>`);
}
function signOut(){
  S.token=null; S.me=null; store.set('ybp_token',null); store.set('ybp_me',null);
  S.mgr=null; S.profiles={}; S.histQuery=''; killDialog(); renderTabs(); go('home');
}
function pinDialog(id){
  confirmDialog(`Make a new PIN for ${id}?`,'Any PIN they had stops working.','Make PIN',async()=>{
    try{
      const r=await call('mgr_setPin',{id});
      const msg=`Your YeahBuddy Poker sign-in: Player ID ${r.id}, PIN ${r.pin}. ${location.href.split('#')[0]}`;
      openDialog(`<h2>PIN for ${esc(r.id)}</h2><div class="pin num">${r.pin}</div>
        <p>Send this to the player. It won't be shown again.</p>
        <div class="row" style="margin-top:14px"><button class="btn" id="copyPin">Copy message</button><button class="btn line" data-dismiss>Done</button></div>`,
        root=>{ root.querySelector('#copyPin').onclick=async e=>{ try{ await navigator.clipboard.writeText(msg); e.target.textContent='Copied'; }catch(_){ e.target.textContent='Copy blocked: write it down'; } }; });
      S.mgr=await call('mgr_overview'); if(S.tab==='manager') render();
    }catch(e){ openDialog(`${errBox(e)}<div class="row" style="margin-top:12px"><button class="btn" data-dismiss>OK</button></div>`); }
  });
}

/* ===================== events ===================== */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button'); if(!t||t.closest('#dialogRoot')&&!t.dataset.act) return;
  const d=t.dataset;
  if(d.tab){ killDialog(); return go(d.tab); }
  if(d.act==='signin') return signInDialog();
  if(d.act==='account') return accountDialog();
  if(d.act==='signout') return signOut();
  if(d.act==='mystats'){ killDialog(); S.histQuery=S.me.id; return go('history'); }
  if(d.act==='newplayer') return playerDialog(null);
  if(d.act==='newgame'){ S.entry={date:'',rows:[],editing:false,msg:null,busy:false}; return render(); }
  if(d.act==='logtoggle'){ const wasAll=S.logAll; S.logAll=!S.logAll; await render(); if(wasAll){ const el=document.getElementById('gamelog'); if(el) el.scrollIntoView({block:'start'}); } return; }
  if(d.act==='newplayer-entry') return playerDialog(null,id=>{ const E=S.entry; if(!E.rows.some(r=>r.id.toLowerCase()===id.toLowerCase())) E.rows.push({id,status:'unpaid',note:''}); E.dirty=true; E.msg=`<div class="ok">${esc(id)} is added to the league and to this game.</div>`; });
  if(d.goto==='pot'){ go('payouts'); setTimeout(()=>{ const el=document.getElementById('toc-pot'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },80); return; }
  if(d.goto==='season'){ S.standMode='season'; S.year=S.snap.currentYear; return go('standings'); }
  if(d.goto==='week'){ S.standMode='week'; S.year=S.snap.currentYear; S.weekIdx=0; return go('standings'); }
  if(d.mode){ S.standMode=d.mode; pushNav(); return render(); }
  if(d.nav) return stepPeriod(Number(d.nav));
  if(d.step){ S.players=Math.max(2,Math.min(50,S.players+Number(d.step))); return render(); }
  if(d.pid){ S.histQuery=d.pid; S.profileYear=null; S.logAll=false; return go('history'); }
  if(d.mgr){ S.mgrTab=d.mgr; S.remStatus=''; if(d.mgr==='reminder') S.rem=null; pushNav(); return render(); }
  const E=S.entry;
  if(d.up!=null||d.down!=null||d.del!=null) E.dirty=true;
  if(d.up!=null){ const i=+d.up; [E.rows[i-1],E.rows[i]]=[E.rows[i],E.rows[i-1]]; return render(); }
  if(d.down!=null){ const i=+d.down; [E.rows[i+1],E.rows[i]]=[E.rows[i],E.rows[i+1]]; return render(); }
  if(d.del!=null){ E.rows.splice(+d.del,1); return render(); }
  if(d.noteadd!=null){ E.rows[+d.noteadd].showNote=true; await render(); const n=document.querySelector(`[data-note="${d.noteadd}"]`); if(n) n.focus(); return; }
  if(d.pin) return pinDialog(d.pin);
  if(d.welcome){ const p=S.mgr.players.find(x=>x.id===d.welcome); return welcomeDialog({id:p.id,first:p.first}); }
  if(d.edit){ const p=S.mgr.players.find(x=>x.id===d.edit); return playerDialog(p); }
  if(d.markpaid){
    const [id,date]=d.markpaid.split('|'); t.disabled=true; t.textContent='Saving…';
    try{ await call('mgr_setPaid',{id,date,paid:true}); S.mgr=await call('mgr_overview'); render(); }
    catch(err){ t.disabled=false; t.textContent='Mark paid'; openDialog(`${errBox(err)}<div class="row" style="margin-top:12px"><button class="btn" data-dismiss>OK</button></div>`); }
  }
});
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset.pay!=null){ S.entry.rows[+t.dataset.pay].status=t.value; S.entry.dirty=true; t.className='paysel st-'+t.value; render(); } });
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset.note!=null){ S.entry.rows[+t.dataset.note].note=t.value; S.entry.dirty=true; } });
document.addEventListener('keydown',e=>{
  if(S.tab!=='standings'||/INPUT|SELECT|TEXTAREA/.test((e.target.tagName||''))||$('#dialogRoot').innerHTML) return;
  if(e.key==='ArrowLeft') stepPeriod(-1); if(e.key==='ArrowRight') stepPeriod(1);
});

/* ===================== start: show saved data instantly, then refresh ===================== */
function storeSnap(s){ const c=Object.assign({},s); delete c.me; store.set(SNAP_KEY,JSON.stringify(c)); }
(async function start(){
  S.token=store.get('ybp_token');
  try{ S.me=JSON.parse(store.get('ybp_me')||'null'); }catch(e){ S.me=null; }
  if(location.hash) applyNav(parseHash());
  pushNav(true);
  let cached=null; try{ cached=JSON.parse(store.get(SNAP_KEY)||'null'); }catch(e){}
  if(cached){ applySnap(cached); renderTabs(); render(); $('#refresh').classList.remove('hide'); }
  else { renderTabs(); render(); }
  try{
    const s=await call('snapshot');
    if(S.token&&!s.me){ S.token=null; S.me=null; store.set('ybp_token',null); store.set('ybp_me',null); }
    else if(s.me){ S.me=s.me; store.set('ybp_me',JSON.stringify(s.me)); }
    const changed=!cached||cached.builtAt!==s.builtAt;
    storeSnap(s); applySnap(s);
    if(changed||!cached){ S.weekly={}; S.standings={}; applySnap(s); renderTabs(); if(!$('#dialogRoot').innerHTML) render(); }
    else renderTabs();
  }catch(e){
    if(!cached) $('#view').innerHTML=`<div class="sheet" style="margin-top:20px">${errBox(e)}<p class="hint">Reload the page to try again.</p></div>`;
  }
  $('#refresh').classList.add('hide');
  const idle=window.requestIdleCallback||(f=>setTimeout(f,1500));
  if(!noMotion()) idle(()=>getLottie().catch(()=>{}));
})();
</script>
